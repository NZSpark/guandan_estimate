# T2.1/T2.2 检测器配置（单类 card_corner，YOLO11n-OBB）
model: yolo11n-obb.pt
classes: ["card_corner"]
# T2.2 = 640/8 的基线配方；T2.2v2 在它之上做 960/20 续训（run_all.sh 中的 T2.2v2 步骤），
# 让训练尺寸与 T2.4 推理尺寸（960）对齐：640 训练 / 960 推理时牌角尺度不一致，
# 漏检集中在 IoU 0.4–0.5 的定位误差上（T2.4 分析）。
image_size: 640
epochs: 8
batch_size: 8
patience: 15
seed: 20260810
augmentation:
  degrees: 15
  perspective: 0.0008
  translate: 0.08
  scale: 0.25
  fliplr: 0.0
  flipud: 0.0
  mosaic: 0.5
  hsv_h: 0.015
  hsv_v: 0.3
