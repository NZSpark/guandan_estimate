[project]
name = "guandan-model-training"
version = "0.1.0"
description = "Offline card-corner detector + rank/suit classifier training pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pillow>=11,<13",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# torch 版训练栈（默认路径，见 README 的“训练后端”一节）
torch = [
    "torch>=2.4",
    "torchvision>=0.19",
]
# TensorFlow 导出 LiteRT / TFLite
export = [
    "tensorflow>=2.16,<2.20",
]
# Ultralytics YOLO-OBB（AGPL-3.0，仅用于训练，不随 APK 分发）
yolo = [
    "ultralytics>=8.3,<9",
]

[tool.uv]
package = false
